name: Build POPFile Image

on:
  workflow_dispatch: # Allows manual trigger via the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5 # Node.js 24 compliance

      - name: Build the Docker image
        run: |
          docker build -t local-popfile-test .
          echo "Build completed successfully!"
